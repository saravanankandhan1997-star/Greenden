<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <nav class="bg-green-100 p-3 flex items-center justify-between shadow-xl sticky top-0 z-10">
        <h1 class="text-2xl font-bold">Greenden</h1>
        <ul class="flex gap-5 text-gray-600">
            <li><a class="hover:underline hover:text-black" href="index.html">Home</a></li>
            <li><a class="hover:underline hover:text-black" href="products.html">Products</a></li>
            <li><a class="hover:underline hover:text-black" href="contact.html">Contact</a></li>
        </ul>
    </nav>
 
    <section class="bg-white">
        <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">
            <h2 class="mb-4 text-4xl tracking-tight font-extrabold text-center text-gray-900">Contact Us</h2>
            <p class="mb-8 lg:mb-16 font-light text-center text-gray-500 sm:text-xl">Got a technical issue? Want to send feedback? Let us know.</p>
            <form class="space-y-8">
                <div><label class="block mb-2 text-sm font-medium">Your email</label><input type="email" class="shadow-sm bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" placeholder="name@flowbite.com"></div>
                <div><label class="block mb-2 text-sm font-medium">Subject</label><input type="text" class="block p-3 w-full text-sm bg-gray-50 rounded-lg border border-gray-300" placeholder="Let us know how we can help you"></div>
                <div><label class="block mb-2 text-sm font-medium">Your message</label><textarea rows="6" class="block p-2.5 w-full text-sm bg-gray-50 rounded-lg border border-gray-300" placeholder="Leave a comment..."></textarea></div>
                <button type="submit" class="py-3 px-5 text-sm font-medium text-center text-white rounded-lg bg-green-700 hover:bg-green-800">Send message</button>
            </form>
        </div>
    </section>
 
    <section class="bg-green-100 p-10 flex flex-col gap-5">
        <h1 class="text-4xl font-bold">Greenden</h1>
        <p>The Standard chunk of Lorem ipsum used since the 1500s is reprodused below for those interest</p>
        <p>@ 2021 Greenday.com</p>
    </section>
</body>
</html>
